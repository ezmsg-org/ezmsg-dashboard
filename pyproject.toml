[project]
name = "ezmsg-dashboard"
description = "Web-based dashboard for monitoring ezmsg status"
authors = [
  { name = "Griffin Milsap", email = "griffin.milsap@gmail.com" },
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = [
  "ezmsg>=3.9.0",
  "fastapi>=0.116.0",
  "numpy>=1.26.0",
  "uvicorn[standard]>=0.42.0",
]

[dependency-groups]
dev = [
  "typer>=0.12.5",
  "pre-commit>=4.2.0",
  "jupyter>=1.1.1",
  {include-group = "lint"},
  {include-group = "test"},
]
lint = [
  "ruff"
]
test = [
  "frozendict>=2.4.4",
  "httpx>=0.28.1",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
  "pytest>=8.3.3",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/ezmsg/dashboard/__version__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ezmsg"]

[tool.hatch.build]
artifacts = [
  "src/ezmsg/dashboard/_web/**/*",
]

[tool.pytest.ini_options]
norecursedirs = "tests/helpers"
addopts = "-p no:warnings"

[tool.uv.sources]
ezmsg = { path = "../ezmsg", editable = true }