name: Test package

on:
  push:
    branches: [main]
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        os:
          - "ubuntu-latest"
          - "windows-latest"
          - "macos-latest"
    runs-on: ${{matrix.os}}

    steps:
      - uses: actions/checkout@v4

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v6

      - name: Install the project
        run: uv sync --python ${{ matrix.python-version }}

      # Temporary until the core PR stack is published as a new beta.
      # Pin a commit so PR results do not change when the branch moves.
      - name: Install core integration prerequisite
        run: uv pip install "ezmsg @ git+https://github.com/ezmsg-org/ezmsg.git@8442e35bd1b9cb703f1b4506b4563821cae28d2c"

      - name: Lint
        run:
          uv tool run ruff check --output-format=github src

      - name: Run tests
        run: uv run --no-sync pytest tests